# ── appbid.lol — Firebase Data Connect Schema ────────────────────────────────
# Clon funcional de outbid.lol: ranking de "listings" (sitios/dominios) que
# compiten por puestos pujando cantidades crecientes. Las mutaciones de escritura
# están bloqueadas para el cliente (@auth NO_ACCESS) — solo las llama el backend
# (Cloud Functions) tras confirmar el pago con Stripe, vía Admin SDK.

# ── Listing ───────────────────────────────────────────────────────────────────
# Un puesto en el ranking. currentBid determina la posición (orden descendente).

type Listing @table {
  id: UUID! @default(expr: "uuidV4()")
  displayName: String!                        # Nombre a mostrar en el ranking, elegido por el usuario
  url: String! @unique                        # Enlace de navegación (web o ficha de tienda de apps) — identifica al listing para re-pujas
  tagline: String                             # Descripción corta mostrada en el ranking (opcional)
  iconUrl: String                             # Favicon/og:image/icono de tienda, capturado tras el pago (opcional — si falla, se muestra el nº de rank)
  ownerEmail: String                          # Contacto del dueño del listing (opcional, sin uso en la UI aún)
  currentBid: Float! @default(value: 1.0)     # Puja actual — determina el rank
  clickCount: Int! @default(value: 0)         # Nº de clics recibidos desde el ranking
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# ── Bid ───────────────────────────────────────────────────────────────────────
# Historial de pujas, usado para el feed de actividad reciente.

type Bid @table {
  id: UUID! @default(expr: "uuidV4()")
  listing: Listing!
  amount: Float!                              # Total acumulado tras esta puja (histórico, no usado para los rankings por período)
  deltaAmount: Float! @default(value: 0)      # Importe realmente pagado en esta transacción — usado para sumar por semana/mes/año
  bidderName: String                          # Nombre mostrado en el feed (opcional)
  displayName: String!                         # Copia del displayName del listing en el momento de la puja
  url: String!                                 # Copia de la url del listing en el momento de la puja
  stripeSessionId: String @unique              # Idempotencia: evita duplicar la puja si Stripe reintenta el webhook
  createdAt: Timestamp! @default(expr: "request.time")
}

# ── Click ─────────────────────────────────────────────────────────────────────
# Un registro por clic en una tarjeta del ranking, para poder contar clics por
# período (semana/mes/año), igual que Bid permite sumar importes por período.

type Click @table {
  id: UUID! @default(expr: "uuidV4()")
  listing: Listing!
  createdAt: Timestamp! @default(expr: "request.time")
}

# ── Visit ─────────────────────────────────────────────────────────────────────
# Un registro por carga de página, para el contador de visitantes. Sin dedupe
# por usuario/IP — es un contador de visitas, no de usuarios únicos. Una Cloud
# Function programada limpia las filas de más de 48h para que la tabla no crezca sin límite.

type Visit @table {
  id: UUID! @default(expr: "uuidV4()")
  createdAt: Timestamp! @default(expr: "request.time")
}

# Vista de agregación: cuenta visitas en la última hora y en las últimas 24h.
# Al ser un único row calculado con NOW(), no necesita variables de tiempo desde GraphQL.
type VisitStat @view(sql: """
  SELECT
    (SELECT COUNT(*) FROM "visit" WHERE created_at > NOW() - INTERVAL '1 hour') AS last_hour,
    (SELECT COUNT(*) FROM "visit" WHERE created_at > NOW() - INTERVAL '24 hours') AS last24h
""") {
  lastHour: Int
  last24h: Int
}

# ── Rankings por período ───────────────────────────────────────────────────────
# Semanal, mensual y anual: cada vista suma Bid.deltaAmount y cuenta Click por
# listing dentro de una ventana de calendario fija (date_trunc es ISO-8601,
# empieza en lunes para 'week'). Un listing sin pujas en la ventana simplemente
# no aparece (JOIN interno con la subconsulta de pujas) — así es como el
# ranking semanal "se vacía" cada lunes sin necesidad de un reset explícito.
# Los clics usan LEFT JOIN + COALESCE porque un listing puede tener pujas pero
# cero clics en la misma ventana y debe seguir apareciendo, con 0 clics.
# Ambas tablas se agregan en subconsultas separadas antes de unirlas a Listing
# para evitar un producto cruzado (fan-out) entre filas de bid y de click.

type WeeklyLeaderboardEntry @view(
  plural: "weeklyLeaderboardEntries"
  singular: "weeklyLeaderboardEntry"
  sql: """
    SELECT
      l.id AS listing_id, l.display_name AS display_name, l.url AS url,
      l.tagline AS tagline, l.icon_url AS icon_url,
      bt.period_total AS period_total, bt.last_bid_at AS last_bid_at,
      COALESCE(ct.period_clicks, 0) AS period_clicks
    FROM "listing" AS l
    JOIN (
      SELECT listing_id, SUM(delta_amount) AS period_total, MAX(created_at) AS last_bid_at
      FROM "bid" WHERE created_at >= date_trunc('week', now()) GROUP BY listing_id
    ) AS bt ON bt.listing_id = l.id
    LEFT JOIN (
      SELECT listing_id, COUNT(*) AS period_clicks
      FROM "click" WHERE created_at >= date_trunc('week', now()) GROUP BY listing_id
    ) AS ct ON ct.listing_id = l.id
  """
) {
  listingId: UUID
  displayName: String
  url: String
  tagline: String
  iconUrl: String
  periodTotal: Float
  lastBidAt: Timestamp
  periodClicks: Int
}

