    JOIN (
      SELECT listing_id, SUM(delta_amount) AS period_total, MAX(created_at) AS last_bid_at
      FROM "bid" WHERE created_at >= date_trunc('month', now()) GROUP BY listing_id
    ) AS bt ON bt.listing_id = l.id
    LEFT JOIN (
      SELECT listing_id, COUNT(*) AS period_clicks
      FROM "click" WHERE created_at >= date_trunc('month', now()) GROUP BY listing_id
