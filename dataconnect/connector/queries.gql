# ── Queries — appbid connector ───────────────────────────────────────────────

query ListWeeklyLeaderboard($limit: Int = 50)
  @auth(level: PUBLIC, insecureReason: "Public leaderboard, no auth in this MVP") {
  weeklyLeaderboardEntries(orderBy: { periodTotal: DESC }, limit: $limit) {
    listingId
    displayName
    url
    tagline
    iconUrl
    periodTotal
    lastBidAt
    periodClicks
  }
}

