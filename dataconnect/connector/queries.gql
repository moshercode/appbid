query ListRecentBids($limit: Int = 20)
  @auth(level: PUBLIC, insecureReason: "Public activity feed, no auth in this MVP") {
  bids(orderBy: { createdAt: DESC }, limit: $limit) {
    id
    deltaAmount
    bidderName
    displayName
    url
    createdAt
  }
}

query GetListingById($id: UUID!)
  @auth(level: PUBLIC, insecureReason: "Public listing detail, no auth in this MVP") {
  listing(id: $id) {
    id
    displayName
    url
    tagline
    ownerEmail
    currentBid
    clickCount
    createdAt
    updatedAt
  }
}

query GetListingByUrl($url: String!)
  @auth(level: PUBLIC, insecureReason: "Public listing lookup, no auth in this MVP") {
  listings(where: { url: { eq: $url } }, limit: 1) {
    id
    displayName
    url
    tagline
    currentBid
  }
}

query GetVisitorStats
  @auth(level: PUBLIC, insecureReason: "Public visitor counter, no auth needed") {
  visitStats {
    lastHour
    last24h
  }
}
